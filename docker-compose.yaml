services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
      - DATABASE_URL=postgresql://sakeenah:sakeenah@db:5432/sakeenah
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sakeenah
      POSTGRES_PASSWORD: sakeenah
      POSTGRES_DB: sakeenah
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakeenah"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
